<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Padel App — Турниры (V2 финал)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; }
  body { background: #0a0a0d; color: #e8e8ec; font-family: system-ui, sans-serif; min-height: 100vh; }
  * { box-sizing: border-box; }
  .stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 20px 40px; }
  .phone { width: 380px; height: 820px; border-radius: 42px; background: #000; padding: 10px;
           box-shadow: 0 40px 80px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(255,255,255,0.05); }
  .phone-screen { width: 100%; height: 100%; border-radius: 32px; overflow: hidden; display: flex; flex-direction: column; }
  .status-bar { height: 32px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between;
                font-size: 13px; font-weight: 600; color: #fff; position: relative; z-index: 2; background: #131317; }
  .status-bar::before { content: ''; position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
                        width: 100px; height: 22px; border-radius: 14px; background: #000; }
  .screen-body { flex: 1; overflow: hidden; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div class="stage">
  <div class="phone">
    <div class="phone-screen">
      <div class="status-bar">
        <span>14:35</span>
        <span style="display:flex; gap:4px; align-items:center;">
          <svg width="14" height="10" viewBox="0 0 14 10" fill="#fff"><path d="M7 .5A10.5 10.5 0 0 0 0 3.1l1.4 1.7A8.3 8.3 0 0 1 7 2.7c2.1 0 4 .7 5.6 2.1L14 3.1A10.5 10.5 0 0 0 7 .5z"/></svg>
          <svg width="18" height="10" viewBox="0 0 18 10" fill="#fff"><rect x="0" y="3" width="16" height="6" rx="1.5" opacity="0.35"/><rect x="1" y="4" width="12" height="4" rx="0.5"/></svg>
        </span>
      </div>
      <div class="screen-body" id="screen-body"></div>
    </div>
  </div>
</div>

<script type="text/babel" src="src/icons.jsx"></script>
<script type="text/babel" src="src/data-tournaments.jsx"></script>
<script type="text/babel" src="src/tournaments-v2.jsx"></script>

<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('screen-body')).render(<ScreenTournaments_V2/>);
</script>

</body>
</html>
