<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Padel App — Экран входа</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; }
  body { background: #0a0a0d; color: #e8e8ec; font-family: system-ui, sans-serif; min-height: 100vh; }
  * { box-sizing: border-box; }
  .stage { min-height: 100vh; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .phone { width: 360px; height: 760px; border-radius: 40px; background: #000; padding: 8px;
           box-shadow: 0 28px 60px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(255,255,255,0.05); }
  .phone-screen { width: 100%; height: 100%; border-radius: 32px; overflow: hidden; display: flex; flex-direction: column; }
  .status-bar { height: 30px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between;
                font-size: 13px; font-weight: 600; color: #fff; position: relative; z-index: 2; background: #131317; }
  .status-bar::before { content: ''; position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
                        width: 90px; height: 20px; border-radius: 14px; background: #000; }
  .screen-body { flex: 1; overflow: hidden; }
  .intro { max-width: 460px; text-align: center; color: #a2a2ab; font-size: 13px; line-height: 1.6; }
  .intro h1 { color: #f3f3f5; font-size: 18px; margin: 0 0 4px; font-weight: 700; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div class="stage">
  <div class="intro">
    <h1>Экран входа</h1>
    Telegram · WhatsApp · Google · Apple — тинт-карточки, ниже Email отдельно через разделитель «или»
  </div>

  <div class="phone"><div class="phone-screen">
    <div class="status-bar"><span>20:19</span><span>🔋</span></div>
    <div class="screen-body" id="screen-v2"></div>
  </div></div>
</div>

<script type="text/babel" src="src/auth-assets.jsx"></script>
<script type="text/babel" src="src/auth-v2.jsx"></script>

<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('screen-v2')).render(<AuthScreen_V2/>);
</script>

</body>
</html>
