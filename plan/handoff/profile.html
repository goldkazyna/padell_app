<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Padel App — Настройки профиля</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    background: #0a0a0d;
    color: #e8e8ec;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  * { box-sizing: border-box; }

  .stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 20px 40px; }
  .phone {
    width: 380px; height: 800px; border-radius: 42px; background: #000; padding: 10px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(255,255,255,0.05);
    position: relative;
  }
  .phone-screen { width: 100%; height: 100%; border-radius: 32px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
  .status-bar { height: 32px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; color: #fff; flex-shrink: 0; position: relative; z-index: 2; }
  .status-bar::before { content: ''; position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 100px; height: 22px; border-radius: 14px; background: #000; }
  .screen-body { flex: 1; overflow: hidden; position: relative; }
  .var-label { text-align: center; font-size: 12px; letter-spacing: 2px; color: #9a9aa3; text-transform: uppercase; font-weight: 600; }
  .notice { max-width: 380px; margin: 0 auto 18px; color: #9a9aa3; font-size: 12px; text-align: center; line-height: 1.5; }
  .notice strong { color: #f0f0f2; }
  .notice a { color: #22c47a; text-decoration: none; font-weight: 500; }

  .tweaks { position: fixed; right: 20px; bottom: 20px; background: rgba(22,22,26,0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 14px 16px; color: #e8e8ec; min-width: 220px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: none; font-size: 13px; z-index: 1000; }
  .tweaks.show { display: block; }
  .tweaks h4 { margin: 0 0 10px; font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: #6a6a73; font-weight: 600; }
  .tweak-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .tweak-row:last-child { margin-bottom: 0; }
  .tweak-row > label { font-size: 11px; color: #9a9aa3; font-weight: 500; }
  .variant-pills { display: flex; gap: 4px; background: rgba(255,255,255,0.04); padding: 3px; border-radius: 10px; }
  .variant-pill { flex: 1; padding: 6px 0; text-align: center; font-size: 12px; font-weight: 500; border-radius: 8px; cursor: pointer; color: #9a9aa3; transition: all 0.15s; border: none; background: none; font-family: inherit; }
  .variant-pill.active { background: #22c47a; color: #0a0a0d; font-weight: 600; }
  .variant-pill:not(.active):hover { color: #e8e8ec; background: rgba(255,255,255,0.04); }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div class="stage">
  <div style="position: relative;">
    <div class="notice">
      <strong>Настройки профиля — варианты рефреша.</strong><br>
      Вернуться на <a href="index.html">главный экран →</a>
    </div>
    <div id="variant-label" class="var-label" style="margin-bottom: 12px;"></div>
    <div class="phone">
      <div class="phone-screen" id="phone-screen">
        <div class="status-bar">
          <span>9:30</span>
          <span style="display:flex; gap:4px; align-items:center;">
            <svg width="14" height="10" viewBox="0 0 14 10" fill="#fff"><path d="M7 .5A10.5 10.5 0 0 0 0 3.1l1.4 1.7A8.3 8.3 0 0 1 7 2.7c2.1 0 4 .7 5.6 2.1L14 3.1A10.5 10.5 0 0 0 7 .5zm0 3.2a7.4 7.4 0 0 0-5 1.9L3.4 7.3A5.2 5.2 0 0 1 7 5.9c1.4 0 2.6.5 3.6 1.4L12 5.6a7.4 7.4 0 0 0-5-1.9zm0 3.1a4.3 4.3 0 0 0-3 1.2l1.4 1.6A2 2 0 0 1 7 8.9c.6 0 1.1.2 1.6.7L10 8a4.3 4.3 0 0 0-3-1.2z"/></svg>
            <svg width="18" height="10" viewBox="0 0 18 10" fill="#fff"><rect x="0" y="3" width="16" height="6" rx="1.5" opacity="0.35"/><rect x="1" y="4" width="12" height="4" rx="0.5"/><rect x="16.5" y="4.5" width="1.5" height="3" rx="0.5"/></svg>
          </span>
        </div>
        <div class="screen-body" id="screen-body"></div>
      </div>
    </div>
    <div style="display: flex; gap: 6px; background: rgba(255,255,255,0.04); padding: 4px; border-radius: 12px; margin-top: 18px; max-width: 380px;">
      <button class="variant-pill" data-variant="v0">Оригинал</button>
      <button class="variant-pill" data-variant="v1">V1 Минимум</button>
      <button class="variant-pill active" data-variant="v2">V2 Секции</button>
      <button class="variant-pill" data-variant="v3">V3 Карточный</button>
    </div>
  </div>
</div>

<div class="tweaks" id="tweaks">
  <h4>Tweaks — Профиль</h4>
  <div class="tweak-row">
    <label>Вариант</label>
    <div class="variant-pills" id="tweak-variants">
      <button class="variant-pill" data-variant="v0">Оригинал</button>
      <button class="variant-pill" data-variant="v1">V1</button>
      <button class="variant-pill active" data-variant="v2">V2</button>
      <button class="variant-pill" data-variant="v3">V3</button>
    </div>
  </div>
</div>

<script>
  /*EDITMODE-BEGIN*/const TWEAK_DEFAULTS = {
    "profileVariant": "v3"
  }/*EDITMODE-END*/;

  const LABELS = {
    v0: '— ОРИГИНАЛ —',
    v1: '— V1 · МИНИМАЛЬНЫЙ РЕФРЕШ —',
    v2: '— V2 · СЕКЦИОНИРОВАННЫЙ —',
    v3: '— V3 · КАРТОЧНЫЙ —',
  };

  let currentVariant = (localStorage.getItem('padel_profile_variant')) || TWEAK_DEFAULTS.profileVariant || 'v2';

  function setVariant(v) {
    currentVariant = v;
    localStorage.setItem('padel_profile_variant', v);
    document.querySelectorAll('.variant-pill').forEach(b => b.classList.toggle('active', b.dataset.variant === v));
    document.getElementById('variant-label').textContent = LABELS[v];
    window.__renderScreen && window.__renderScreen();
    window.parent.postMessage({type: '__edit_mode_set_keys', edits: {profileVariant: v}}, '*');
  }

  document.querySelectorAll('.variant-pill').forEach(b => b.addEventListener('click', () => setVariant(b.dataset.variant)));

  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type === '__activate_edit_mode') document.getElementById('tweaks').classList.add('show');
    if (d.type === '__deactivate_edit_mode') document.getElementById('tweaks').classList.remove('show');
  });
  window.parent.postMessage({type: '__edit_mode_available'}, '*');

  document.getElementById('variant-label').textContent = LABELS[currentVariant];
  document.querySelectorAll('.variant-pill').forEach(b => b.classList.toggle('active', b.dataset.variant === currentVariant));
  window.__getVariant = () => currentVariant;
</script>

<script type="text/babel" src="src/icons.jsx"></script>
<script type="text/babel" src="src/icons-profile.jsx"></script>
<script type="text/babel" src="src/data-profile.jsx"></script>
<script type="text/babel" src="src/profile-v0.jsx"></script>
<script type="text/babel" src="src/profile-v1.jsx"></script>
<script type="text/babel" src="src/profile-v2.jsx"></script>
<script type="text/babel" src="src/profile-v3.jsx"></script>

<script type="text/babel">
  function App() {
    const [, setTick] = React.useState(0);
    React.useEffect(() => { window.__renderScreen = () => setTick(t => t + 1); }, []);
    const v = window.__getVariant();
    if (v === 'v0') return <ScreenP0/>;
    if (v === 'v1') return <ScreenP1/>;
    if (v === 'v3') return <ScreenP3/>;
    return <ScreenP2/>;
  }
  const root = ReactDOM.createRoot(document.getElementById('screen-body'));
  root.render(<App/>);
</script>

</body>
</html>
